# docker compose up -d --build
services:
  styx:
    build: .
    container_name: styx
    restart: unless-stopped
    env_file: .env          # Quicknode endpoints, never committed
    environment:
      - PORT=8787
    ports:
      - "127.0.0.1:8790:8787"   # 8787 on this box belongs to another service; Caddy proxies to 8790
    mem_limit: 512m
