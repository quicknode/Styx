<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elysium Settlement Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="/brand/elysium-mark-dark.svg" />
  </head>
  <body>
    <div id="frame">
      <div id="deck">
        <div id="top">
          <div id="eyebrow"><b>// Settlement monitor</b><span id="netname">Elysium</span></div>
          <div id="tabs"></div>
          <div id="lockup">
            <div id="netswitch"><button data-net="mainnet">Mainnet</button><button data-net="testnet">Testnet</button></div>
            <img class="lk-ely" src="/brand/elysium-wordmark-dark.svg" alt="Elysium" />
            <span class="lk-x"></span>
            <img class="lk-qn" src="/brand/qn-wordmark-dark.svg" alt="Quicknode" />
          </div>
        </div>
        <div id="toprule"></div>
        <div id="health"></div>
        <div id="stage"></div>
        <div id="keys">1–6 tabs · / find a tx · p pause · click any marker</div>
        <div id="bottom">
          <div id="text">
            <div id="title">Settling to <span class="acc">HyperEVM</span>, live.</div>
            <div id="caption">Connecting to the rollup contracts…</div>
          </div>
          <div id="nav"><div id="counter"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
