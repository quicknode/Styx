<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styx · Elysium Settlement Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="/brand/elysium-mark-dark.svg" />
  </head>
  <body>
    <div id="frame">
      <div id="deck">
        <div id="top">
          <div id="eyebrow"><b class="brand">Styx<svg class="wave" viewBox="0 0 96 10" aria-hidden="true"><defs><linearGradient id="styxgrad" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="96" y2="0"><stop offset="0" stop-color="#146f8c"/><stop offset=".35" stop-color="#34b7dd"/><stop offset=".65" stop-color="#0e7f6a"/><stop offset="1" stop-color="#146f8c"/><animateTransform attributeName="gradientTransform" type="translate" from="-96 0" to="96 0" dur="9s" repeatCount="indefinite"/></linearGradient></defs><path class="w1" d="M0 5 Q8 1 16 5 T32 5 T48 5 T64 5 T80 5 T96 5"/></svg></b><span class="sub">Elysium Settlement Monitor</span><span id="netname" class="sr">mainnet</span></div>
          <div id="tabs"></div>
          <div id="netswitch">
            <span id="livedot" aria-hidden="true"></span>
            <button id="netbtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Network">Mainnet<span class="caret" aria-hidden="true"></span></button>
            <ul id="netmenu" role="listbox" hidden><li role="option" data-net="mainnet" aria-selected="true">Mainnet</li><li role="option" data-net="testnet" aria-selected="false">Testnet</li></ul>
          </div>
        </div>
        <div id="toprule"></div>
        <div id="stage"></div>
        <div id="lockup">
          <img class="lk-ely" src="/brand/elysium-wordmark-dark.svg" alt="Elysium" />
          <span class="lk-x"></span>
          <img class="lk-qn" src="/brand/qn-wordmark-dark.svg" alt="Quicknode" />
        </div>
        <div id="keys" aria-hidden="true">1–7 tabs · / search · p pause</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
