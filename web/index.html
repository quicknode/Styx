<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Styx · Elysium Settlement Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="/brand/elysium-mark-dark.svg" />
  </head>
  <body>
    <div id="frame">
      <div id="deck">
        <div id="top">
          <div id="eyebrow"><b class="brand">Styx<svg class="wave" viewBox="0 0 96 12" aria-hidden="true"><path class="w1" d="M0 6 C5 2 9 2 14 6 S22 11 29 6 S37 1 43 6 S50 10 58 6 S67 2 72 6 S80 10 86 6 S92 3 96 6"/></svg></b><span class="sub">Elysium Settlement Monitor</span><span id="netname" class="sr">mainnet</span></div>
          <div id="tabs"></div>
          <div id="netswitch">
            <span id="livedot" aria-hidden="true"></span>
            <button id="netbtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Network">Mainnet<span class="caret" aria-hidden="true"></span></button>
            <ul id="netmenu" role="listbox" hidden><li role="option" data-net="mainnet" aria-selected="true">Mainnet</li><li role="option" data-net="testnet" aria-selected="false">Testnet</li></ul>
          </div>
        </div>
        <div id="toprule"></div>
        <div id="stage"></div>
        <div id="lockup">
          <img class="lk-ely" src="/brand/elysium-wordmark-dark.svg" alt="Elysium" />
          <span class="lk-x"></span>
          <img class="lk-qn" src="/brand/qn-wordmark-dark.svg" alt="Quicknode" />
        </div>
        <div id="keys" aria-hidden="true">1–7 tabs · / search · p pause</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
