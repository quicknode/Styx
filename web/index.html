<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elysium Settlement Monitor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;1,6..72,300;1,6..72,400&family=DM+Sans:opsz,wght@9..40,400;9..40,500&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="icon" href="/brand/elysium-mark-dark.svg" />
  </head>
  <body>
    <div id="frame">
      <div id="deck">
        <div id="top">
          <div id="eyebrow"><span id="livedot" aria-hidden="true"></span><b>Elysium Settlement Monitor</b><span id="netname" class="sr">mainnet</span></div>
          <div id="tabs"></div>
          <div id="netswitch">
            <label class="sr" for="netsel">Network</label>
            <select id="netsel"><option value="mainnet">Mainnet</option><option value="testnet">Testnet</option></select>
          </div>
        </div>
        <div id="toprule"></div>
        <div id="stage"></div>
        <div id="lockup">
          <img class="lk-ely" src="/brand/elysium-wordmark-dark.svg" alt="Elysium" />
          <span class="lk-x"></span>
          <img class="lk-qn" src="/brand/qn-wordmark-dark.svg" alt="Quicknode" />
        </div>
        <div id="keys" aria-hidden="true">1–7 tabs · / search · p pause</div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
